/* ============================== HELPERS ============================== */
function timeAgo(ts) {
  if (!ts) return '';
  const date = ts.toDate ? ts.toDate() : new Date(ts);
  const secs = Math.floor((Date.now() - date.getTime()) / 1000);
  if (secs < 60) return 'now';
  const mins = Math.floor(secs / 60);
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd';
  return date.toLocaleDateString();
}

function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
}

async function compressImage(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================== TOASTS ============================== */
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, type = 'info') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }, []);
  return (
    <ToastContext.Provider value={push}>
      {children}
      <div className="fixed bottom-4 right-4 z-[100] space-y-2 w-[90vw] max-w-sm">
        {toasts.map(t => (
          <div key={t.id} className={
            "fade-in rounded-xl px-4 py-3 shadow-lg text-sm font-medium text-white " +
            (t.type === 'error' ? 'bg-red-500' : t.type === 'success' ? 'bg-emerald-500' : 'bg-ink-800')
          }>{t.message}</div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}

/* ============================== APP ROOT ============================== */
function App() {

  const [theme, setTheme] = useState(localStorage.getItem('zlove-theme') || 'light');
  const [route, setRoute] = useState({ name: 'home' });

  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    localStorage.setItem('zlove-theme', theme);
  }, [theme]);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => setFirebaseUser(u || null));
    return unsub;
  }, []);

  useEffect(() => {
    if (!firebaseUser) { setProfile(null); return; }
    const unsub = db.collection('users').doc(firebaseUser.uid).onSnapshot(snap => {
      setProfile(snap.exists ? { id: snap.id, ...snap.data() } : null);
    });
    return unsub;
  }, [firebaseUser]);

  const authValue = useMemo(() => ({ firebaseUser, profile }), [firebaseUser, profile]);

  if (firebaseUser === undefined) {
    return <SplashScreen />;
  }

  return (
    <ThemeContext.Provider value={{ theme, setTheme }}>
      <ToastProvider>
        <AuthContext.Provider value={authValue}>
          {!firebaseUser ? (
            <AuthScreen />
          ) : !profile ? (
            <SplashScreen />
          ) : !profile.username ? (
            <OnboardingScreen />
          ) : profile.suspended ? (
            <SuspendedScreen />
          ) : (
            <MainApp route={route} setRoute={setRoute} />
          )}
        </AuthContext.Provider>
      </ToastProvider>
    </ThemeContext.Provider>
  );
}

      } else {

        const cred = await auth.createUserWithEmailAndPassword(email, password);

    } finally { setBusy(false); }

        <div className="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-brand-400/30 blur-3xl"></div>
        <div className="absolute bottom-0 right-0 w-80 h-80 rounded-full bg-white/10 blur-3xl"></div>
        <div className="relative text-white px-12 max-w-md">

/* ============================== ONBOARDING ============================== */
function OnboardingScreen() {
  const { firebaseUser } = useAuth();
  const [username, setUsername] = useState('');
  const [displayName, setDisplayName] = useState(firebaseUser.displayName || '');
  const [status, setStatus] = useState(null);
  const [busy, setBusy] = useState(false);
  const toast = useToast();

  useEffect(() => {
    if (!username || username.length < 3) { setStatus(null); return; }
    const handle = setTimeout(async () => {
      setStatus('checking');
      const snap = await uniqueUsernameCheck(username);
      setStatus(snap.exists ? 'taken' : 'available');
    }, 400);
    return () => clearTimeout(handle);
  }, [username]);

  const submit = async (e) => {
    e.preventDefault();
    if (status !== 'available' || !displayName.trim()) return;
    setBusy(true);
    try {
      const uname = username.toLowerCase();
      await db.runTransaction(async (tx) => {
        const unameRef = db.collection('usernames').doc(uname);
        const unameSnap = await tx.get(unameRef);
        if (unameSnap.exists) throw new Error('Username was just taken, try another.');
        tx.set(unameRef, { uid: firebaseUser.uid });
        tx.set(db.collection('users').doc(firebaseUser.uid), {
          username: uname, displayName: displayName.trim(), joinDate: FieldValue.serverTimestamp()
        }, { merge: true });
      });
    } catch (err) {
      toast(err.message, 'error');
    } finally { setBusy(false); }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-6 bg-white dark:bg-ink-900">
      <form onSubmit={submit} className="w-full max-w-sm">
        <h2 className="font-display text-2xl font-bold mb-1">Set up your profile</h2>
        <p className="text-slate-500 text-sm mb-6">Pick a unique username to get started.</p>
        <label className="text-xs font-semibold text-slate-500">Display name</label>
        <input value={displayName} onChange={e => setDisplayName(e.target.value)} required
          className="w-full mb-4 mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-ink-700 bg-transparent text-sm" placeholder="Jane Doe" />
        <label className="text-xs font-semibold text-slate-500">Username</label>
        <div className="relative mt-1 mb-1">
          <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm">@</span>
          <input value={username} onChange={e => setUsername(e.target.value.replace(/[^a-zA-Z0-9_]/g, ''))} required
            className="w-full pl-8 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-ink-700 bg-transparent text-sm" placeholder="janedoe" />
        </div>
        <div className="h-5 text-xs mb-4">
          {status === 'checking' && <span className="text-slate-400">Checking availability…</span>}
          {status === 'available' && <span className="text-emerald-500"><i className="fa-solid fa-check mr-1"></i>Available</span>}
          {status === 'taken' && <span className="text-red-500"><i className="fa-solid fa-xmark mr-1"></i>Already taken</span>}
        </div>
        <button disabled={status !== 'available' || busy} type="submit"
          className="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-40 text-white rounded-xl py-2.5 font-semibold text-sm transition">
          {busy ? 'Creating…' : 'Continue'}
        </button>
      </form>
    </div>
  );
}

function Avatar({ user, size = 10, onClick }) {
  const src = user?.photoURL || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(user?.displayName || user?.username || '?')}`;
  return <img onClick={onClick} src={src} className={`w-${size} h-${size} rounded-full object-cover shrink-0 ${onClick ? 'cursor-pointer' : ''}`} style={{ width: size*4, height: size*4 }} />;
}

    const valid = chosen.filter(f => {
      if (!f.type.startsWith('image/')) { toast(f.name + ' is not an image', 'error'); return false; }
      if (f.size > 15 * 1024 * 1024) { toast(f.name + ' exceeds 15MB', 'error'); return false; }
      return true;
    });
    setFiles(f => [...f, ...valid]);
    setPreviews(p => [...p, ...valid.map(f => URL.createObjectURL(f))]);
  };

  const removeFile = (idx) => {
    setFiles(f => f.filter((_, i) => i !== idx));
    setPreviews(p => p.filter((_, i) => i !== idx));
  };

  const submit = async () => {
    if (!text.trim() && files.length === 0) return;
    setBusy(true); setProgress(0);
    try {
      const imageUrls = [];
      for (let i = 0; i < files.length; i++) {
        const compressed = await compressImage(files[i]);
        const path = `posts/${profile.id}/${Date.now()}_${i}.jpg`;
        const ref = storage.ref(path);
        await new Promise((resolve, reject) => {
          const task = ref.put(compressed, { contentType: 'image/jpeg' });
          task.on('state_changed', snap => {
            const pct = (snap.bytesTransferred / snap.totalBytes) * 100;
            setProgress(Math.round(((i + pct / 100) / files.length) * 100));
          }, reject, resolve);
        });
        imageUrls.push(await ref.getDownloadURL());
      }
      await db.collection('posts').add({
        authorId: profile.id, text: text.trim(), images: imageUrls,
        createdAt: FieldValue.serverTimestamp(), likesCount: 0, commentsCount: 0, sharesCount: 0
      });
      await db.collection('users').doc(profile.id).update({ postsCount: FieldValue.increment(1) });
      setText(''); setFiles([]); setPreviews([]);
      toast('Posted!', 'success');
      onPosted && onPosted();
    } catch (err) {
      toast(err.message, 'error');
    } finally { setBusy(false); setProgress(0); }
  };

  return (
    <div className="bg-white dark:bg-ink-800 rounded-2xl border border-slate-100 dark:border-ink-700 p-4 mb-4">
      <div className="flex gap-3">
        <Avatar user={profile} size={10} />
        <div className="flex-1 min-w-0">
          <textarea value={text} onChange={e => setText(e.target.value)} placeholder={`What's on your mind, ${profile.displayName?.split(' ')[0]}?`}
            className="w-full resize-none bg-transparent text-sm py-2 focus:outline-none min-h-[44px]" rows={2} />
          {previews.length > 0 && (
            <div className="grid grid-cols-3 gap-2 mb-2">
              {previews.map((p, i) => (
                <div key={i} className="relative rounded-lg overflow-hidden aspect-square group">
                  <img src={p} className="w-full h-full object-cover" />
                  <button onClick={() => removeFile(i)} className="absolute top-1 right-1 bg-black/60 text-white rounded-full w-6 h-6 text-xs">✕</button>
                </div>
              ))}
            </div>
          )}
          {busy && progress > 0 && (
            <div className="w-full h-1.5 bg-slate-100 dark:bg-ink-700 rounded-full overflow-hidden mb-2">
              <div className="h-full bg-brand-600 transition-all" style={{ width: progress + '%' }}></div>
            </div>
          )}
          <div className="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-ink-700 mt-1">
            <button onClick={() => fileRef.current.click()} disabled={files.length >= 10}
              className="text-brand-600 dark:text-brand-400 text-sm font-semibold flex items-center gap-1.5 disabled:opacity-40">
              <i className="fa-regular fa-image"></i> Photo ({files.length}/10)
            </button>
            <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={onFiles} />
            <button onClick={submit} disabled={busy || (!text.trim() && files.length === 0)}
              className="bg-brand-600 hover:bg-brand-700 disabled:opacity-40 text-white text-sm font-semibold px-5 py-1.5 rounded-full transition">
              {busy ? 'Posting…' : 'Post'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================== POST CARD ============================== */
function PostCard({ post, go }) {
  const { profile } = useAuth();
  const toast = useToast();
  const [author, setAuthor] = useState(null);
  const [liked, setLiked] = useState(false);
  const [likesCount, setLikesCount] = useState(post.likesCount || 0);
  const [showComments, setShowComments] = useState(false);
  const [bookmarked, setBookmarked] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [editing, setEditing] = useState(false);
  const [editText, setEditText] = useState(post.text);

  useEffect(() => {
    const unsub = db.collection('users').doc(post.authorId).onSnapshot(s => setAuthor(s.exists ? s.data() : null));
    return unsub;
  }, [post.authorId]);

  useEffect(() => {
    const unsub = db.collection('posts').doc(post.id).collection('likes').doc(profile.id).onSnapshot(s => setLiked(s.exists));
    return unsub;
  }, [post.id, profile.id]);

  useEffect(() => {
    const unsub = db.collection('bookmarks').doc(profile.id).collection('items').doc(post.id).onSnapshot(s => setBookmarked(s.exists));
    return unsub;
  }, [post.id, profile.id]);

  const toggleLike = async () => {
    const likeRef = db.collection('posts').doc(post.id).collection('likes').doc(profile.id);
    const postRef = db.collection('posts').doc(post.id);
    try {
      if (liked) {
        await likeRef.delete();
        await postRef.update({ likesCount: FieldValue.increment(-1) });
        setLikesCount(c => c - 1);
      } else {
        await likeRef.set({ uid: profile.id, createdAt: FieldValue.serverTimestamp() });
        await postRef.update({ likesCount: FieldValue.increment(1) });
        setLikesCount(c => c + 1);
        if (post.authorId !== profile.id) {
          db.collection('notifications').doc(post.authorId).collection('items').add({
            type: 'like', fromUserId: profile.id, postId: post.id, read: false, createdAt: FieldValue.serverTimestamp()
          });
        }
      }
    } catch (e) { toast('Could not update like', 'error'); }
  };

  const toggleBookmark = async () => {
    const ref = db.collection('bookmarks').doc(profile.id).collection('items').doc(post.id);
    if (bookmarked) { await ref.delete(); toast('Removed from saved'); }
    else { await ref.set({ postId: post.id, createdAt: FieldValue.serverTimestamp() }); toast('Saved', 'success'); }
  };

  const share = async () => {
    await db.collection('posts').doc(post.id).update({ sharesCount: FieldValue.increment(1) });
    navigator.clipboard?.writeText(window.location.href.split('#')[0] + '#post-' + post.id);
    toast('Link copied to clipboard', 'success');
  };

  const deletePost = async () => {
    if (!confirm('Delete this post?')) return;
    await db.collection('posts').doc(post.id).delete();
    await db.collection('users').doc(profile.id).update({ postsCount: FieldValue.increment(-1) });
    toast('Post deleted', 'success');
  };

  const saveEdit = async () => {
    await db.collection('posts').doc(post.id).update({ text: editText.trim(), edited: true });
    setEditing(false);
  };

  if (!author) return <PostSkeleton />;

  return (
    <div id={'post-' + post.id} className="bg-white dark:bg-ink-800 rounded-2xl border border-slate-100 dark:border-ink-700 p-4 mb-4 fade-in">
      <div className="flex items-start justify-between mb-2">
        <div className="flex items-center gap-3 cursor-pointer" onClick={() => go({ name: 'profile', uid: post.authorId })}>
          <Avatar user={author} size={10} />
          <div>
            <p className="font-semibold text-sm">{author.displayName}</p>
            <p className="text-xs text-slate-400">@{author.username} · {timeAgo(post.createdAt)}{post.edited ? ' · edited' : ''}</p>
          </div>
        </div>
        {post.authorId === profile.id && (
          <div className="relative">
            <button onClick={() => setMenuOpen(m => !m)} className="text-slate-400 px-2"><i className="fa-solid fa-ellipsis"></i></button>
            {menuOpen && (
              <div className="absolute right-0 mt-1 bg-white dark:bg-ink-700 shadow-lg rounded-xl overflow-hidden border border-slate-100 dark:border-ink-600 z-10 w-32">
                <button onClick={() => { setEditing(true); setMenuOpen(false); }} className="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 dark:hover:bg-ink-600">Edit</button>
                <button onClick={deletePost} className="w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-slate-50 dark:hover:bg-ink-600">Delete</button>
              </div>
            )}
          </div>
        )}
      </div>

      {editing ? (
        <div className="mb-2">
          <textarea value={editText} onChange={e => setEditText(e.target.value)} className="w-full bg-transparent border border-slate-200 dark:border-ink-600 rounded-lg p-2 text-sm" rows={3} />
          <div className="flex gap-2 mt-1">
            <button onClick={saveEdit} className="text-xs font-semibold text-brand-600">Save</button>
            <button onClick={() => setEditing(false)} className="text-xs font-semibold text-slate-400">Cancel</button>
          </div>
        </div>
      ) : post.text && <p className="text-sm whitespace-pre-wrap mb-2 leading-relaxed">{post.text}</p>}

      {post.images?.length > 0 && (
        <div className={`grid gap-1 rounded-xl overflow-hidden mb-2 ${post.images.length === 1 ? 'grid-cols-1' : 'grid-cols-2'}`}>
          {post.images.map((img, i) => <img key={i} src={img} loading="lazy" className="w-full object-cover max-h-[420px]" />)}
        </div>
      )}

      <div className="flex items-center justify-between text-slate-500 text-sm pt-2 border-t border-slate-100 dark:border-ink-700">
        <button onClick={toggleLike} className={"flex items-center gap-1.5 " + (liked ? "text-red-500" : "hover:text-red-500")}>
          <i className={(liked ? "fa-solid" : "fa-regular") + " fa-heart"}></i> {likesCount}
        </button>
        <button onClick={() => setShowComments(s => !s)} className="flex items-center gap-1.5 hover:text-brand-600">
          <i className="fa-regular fa-comment"></i> {post.commentsCount || 0}
        </button>
        <button onClick={share} className="flex items-center gap-1.5 hover:text-emerald-500">
          <i className="fa-regular fa-share-from-square"></i> {post.sharesCount || 0}
        </button>
        <button onClick={toggleBookmark} className={bookmarked ? "text-brand-600" : "hover:text-brand-600"}>
          <i className={(bookmarked ? "fa-solid" : "fa-regular") + " fa-bookmark"}></i>
        </button>
      </div>

      {showComments && <Comments postId={post.id} go={go} />}
    </div>
  );
}

/* ============================== COMMENTS ============================== */
function Comments({ postId, go }) {
  const { profile } = useAuth();
  const [comments, setComments] = useState([]);
  const [text, setText] = useState('');

  useEffect(() => {
    const unsub = db.collection('posts').doc(postId).collection('comments').orderBy('createdAt', 'asc').limit(100)
      .onSnapshot(snap => setComments(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, [postId]);

  const submit = async () => {
    if (!text.trim()) return;
    const postSnap = await db.collection('posts').doc(postId).get();
    const post = postSnap.data();
    await db.collection('posts').doc(postId).collection('comments').add({
      authorId: profile.id, text: text.trim(), createdAt: FieldValue.serverTimestamp()
    });
    await db.collection('posts').doc(postId).update({ commentsCount: FieldValue.increment(1) });
    if (post.authorId !== profile.id) {
      db.collection('notifications').doc(post.authorId).collection('items').add({
        type: 'comment', fromUserId: profile.id, postId, read: false, createdAt: FieldValue.serverTimestamp()
      });
    }
    setText('');
  };

  return (
    <div className="mt-3 pt-3 border-t border-slate-100 dark:border-ink-700 space-y-3">
      {comments.map(c => <CommentRow key={c.id} comment={c} go={go} />)}
      <div className="flex items-center gap-2">
        <Avatar user={profile} size={7} />
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()}
          placeholder="Write a comment…" className="flex-1 bg-slate-50 dark:bg-ink-700 rounded-full px-4 py-1.5 text-sm" />
        <button onClick={submit} className="text-brand-600 text-sm font-semibold">Send</button>
      </div>
    </div>
  );
}

function CommentRow({ comment, go }) {

}

      .onSnapshot(async snap => {
        const ids = snap.docs.map(d => d.id);
        if (ids.length === 0) { setPosts([]); return; }
        const chunks = [];
        for (const id of ids) {
          const s = await db.collection('posts').doc(id).get();
          if (s.exists) chunks.push({ id: s.id, ...s.data() });

        setPosts(chunks);
      });
    return unsub;
  }, [profile.id]);

  return (
    <div>
      <h2 className="font-display text-lg font-bold mb-4">Saved posts</h2>
      {posts === null && <PostSkeleton />}
      {posts?.length === 0 && <p className="text-sm text-slate-400 text-center py-16">Nothing saved yet.</p>}
      {posts?.map(p => <PostCard key={p.id} post={p} go={go} />)}
    </div>
  );
}

function ProfileScreen({ uid, go }) {

    const unsub = db.collection('users').doc(uid).onSnapshot(s => setUser(s.exists ? { id: s.id, ...s.data() } : null));
    return unsub;
  }, [uid]);

  useEffect(() => {
    const unsub = db.collection('posts').where('authorId', '==', uid).orderBy('createdAt', 'desc').limit(30)
      .onSnapshot(snap => setPosts(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, [uid]);

  useEffect(() => {
    if (uid === me.id) return;
    const unsub = db.collection('follows').doc(me.id + '_' + uid).onSnapshot(s => setFollowing(s.exists));
    return unsub;
  }, [uid, me.id]);

      await db.collection('follows').doc(relId).delete();
      await db.collection('users').doc(uid).update({ followersCount: FieldValue.increment(-1) });
      await db.collection('users').doc(me.id).update({ followingCount: FieldValue.increment(-1) });
    } else {
      await db.collection('follows').doc(relId).set({ followerId: me.id, followingId: uid, createdAt: FieldValue.serverTimestamp() });
      await db.collection('users').doc(uid).update({ followersCount: FieldValue.increment(1) });
      await db.collection('users').doc(me.id).update({ followingCount: FieldValue.increment(1) });
      db.collection('notifications').doc(uid).collection('items').add({ type: 'follow', fromUserId: me.id, read: false, createdAt: FieldValue.serverTimestamp() });
    }
  };

  if (!user) return <PostSkeleton />;
  const isMe = uid === me.id;

  return (
    <div>
      <div className="bg-white dark:bg-ink-800 rounded-2xl border border-slate-100 dark:border-ink-700 overflow-hidden mb-4">

              className="w-20 h-20 rounded-full border-4 border-white dark:border-ink-800 object-cover" />
            {isMe ? (
              <button onClick={() => setEditing(true)} className="border border-slate-200 dark:border-ink-600 rounded-full px-4 py-1.5 text-sm font-semibold">Edit profile</button>

                {following ? 'Following' : 'Follow'}

            )}
          </div>
          <h2 className="font-display font-bold text-lg">{user.displayName}</h2>
          <p className="text-slate-400 text-sm">@{user.username}</p>
          {user.bio && <p className="text-sm mt-2">{user.bio}</p>}
          <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-xs text-slate-400">
            {user.location && <span><i className="fa-solid fa-location-dot mr-1"></i>{user.location}</span>}
            {user.website && <a href={user.website} target="_blank" className="text-brand-600"><i className="fa-solid fa-link mr-1"></i>{user.website}</a>}
            {user.occupation && <span><i className="fa-solid fa-briefcase mr-1"></i>{user.occupation}</span>}
          </div>
          <div className="flex gap-5 mt-3 text-sm">
            <span><b>{user.postsCount || 0}</b> <span className="text-slate-400">Posts</span></span>
            <span><b>{user.followersCount || 0}</b> <span className="text-slate-400">Followers</span></span>
            <span><b>{user.followingCount || 0}</b> <span className="text-slate-400">Following</span></span>
          </div>
        </div>
      </div>

      {posts.length === 0 ? (
        <p className="text-sm text-slate-400 text-center py-16">No posts yet.</p>
      ) : posts.map(p => <PostCard key={p.id} post={p} go={go} />)}

      {editing && <EditProfileModal user={user} onClose={() => setEditing(false)} />}
    </div>
  );
}

function EditProfileModal({ user, onClose }) {
  const toast = useToast();
  const [form, setForm] = useState({
    displayName: user.displayName || '', bio: user.bio || '', location: user.location || '',
    website: user.website || '', occupation: user.occupation || '', gender: user.gender || '',
    dob: user.dob || '', relationshipStatus: user.relationshipStatus || ''
  });
  const [photoFile, setPhotoFile] = useState(null);
  const [coverFile, setCoverFile] = useState(null);
  const [busy, setBusy] = useState(false);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const save = async () => {
    setBusy(true);
    try {
      const update = { ...form };
      if (photoFile) {
        const compressed = await compressImage(photoFile, 512);
        const ref = storage.ref(`avatars/${user.id}.jpg`);
        await ref.put(compressed, { contentType: 'image/jpeg' });
        update.photoURL = await ref.getDownloadURL();
      }
      if (coverFile) {
        const compressed = await compressImage(coverFile, 1200);
        const ref = storage.ref(`covers/${user.id}.jpg`);
        await ref.put(compressed, { contentType: 'image/jpeg' });
        update.coverURL = await ref.getDownloadURL();
      }
      await db.collection('users').doc(user.id).update(update);
      toast('Profile updated', 'success');
      onClose();
    } catch (e) { toast(e.message, 'error'); } finally { setBusy(false); }
  };

  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
      <div className="bg-white dark:bg-ink-800 rounded-t-2xl md:rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5">
        <div className="flex justify-between items-center mb-4">
          <h3 className="font-display font-bold text-lg">Edit profile</h3>
          <button onClick={onClose} className="text-slate-400"><i className="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div className="space-y-3">
          <div>
            <label className="text-xs font-semibold text-slate-500">Profile photo</label>
            <input type="file" accept="image/*" onChange={e => setPhotoFile(e.target.files[0])} className="text-sm mt-1 block" />
          </div>
          <div>
            <label className="text-xs font-semibold text-slate-500">Cover photo</label>
            <input type="file" accept="image/*" onChange={e => setCoverFile(e.target.files[0])} className="text-sm mt-1 block" />
          </div>
          {[
            ['displayName', 'Display name', 'text'], ['bio', 'Bio', 'textarea'], ['location', 'Location', 'text'],
            ['website', 'Website', 'text'], ['occupation', 'Occupation', 'text'], ['dob', 'Date of birth', 'date'],
          ].map(([key, label, type]) => (
            <div key={key}>
              <label className="text-xs font-semibold text-slate-500">{label}</label>
              {type === 'textarea' ? (
                <textarea value={form[key]} onChange={e => set(key, e.target.value)} rows={3}
                  className="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-ink-600 bg-transparent text-sm" />
              ) : (
                <input type={type} value={form[key]} onChange={e => set(key, e.target.value)}
                  className="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-ink-600 bg-transparent text-sm" />
              )}
            </div>
          ))}
          <div>
            <label className="text-xs font-semibold text-slate-500">Gender</label>
            <select value={form.gender} onChange={e => set('gender', e.target.value)} className="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-ink-600 bg-transparent text-sm">
              <option value="">Prefer not to say</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Other</option>
            </select>
          </div>
          <div>
            <label className="text-xs font-semibold text-slate-500">Relationship status</label>
            <select value={form.relationshipStatus} onChange={e => set('relationshipStatus', e.target.value)} className="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-ink-600 bg-transparent text-sm">
              <option value="">Prefer not to say</option><option>Single</option><option>In a relationship</option><option>Married</option><option>It's complicated</option>
            </select>
          </div>
        </div>
        <button onClick={save} disabled={busy} className="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white rounded-xl py-2.5 font-semibold text-sm mt-5">
          {busy ? 'Saving…' : 'Save changes'}
        </button>
      </div>
    </div>
  );
}

/* ============================== ADMIN ============================== */
function AdminScreen() {
  const [stats, setStats] = useState(null);
  const [users, setUsers] = useState([]);
  const [tab, setTab] = useState('dashboard');
  const [search, setSearch] = useState('');
  const toast = useToast();

  useEffect(() => {
    (async () => {
      const [usersSnap, postsSnap] = await Promise.all([
        db.collection('users').get(), db.collection('posts').get()
      ]);
      let comments = 0, likes = 0, shares = 0;
      postsSnap.docs.forEach(d => { const p = d.data(); comments += p.commentsCount || 0; likes += p.likesCount || 0; shares += p.sharesCount || 0; });
      setStats({ users: usersSnap.size, posts: postsSnap.size, comments, likes, shares });
    })();
  }, []);

  useEffect(() => {
    if (tab !== 'users') return;
    const unsub = db.collection('users').limit(100).onSnapshot(snap => setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, [tab]);

  const toggleSuspend = async (u) => {
    await db.collection('users').doc(u.id).update({ suspended: !u.suspended });
    toast(u.suspended ? 'User reactivated' : 'User suspended', 'success');
  };

  const filtered = users.filter(u => !search || u.username?.includes(search.toLowerCase()) || u.displayName?.toLowerCase().includes(search.toLowerCase()));

  return (
    <div>
      <h2 className="font-display text-lg font-bold mb-4">Admin panel</h2>
      <div className="flex gap-2 mb-4">
        {['dashboard', 'users'].map(t => (
          <button key={t} onClick={() => setTab(t)} className={"px-4 py-1.5 rounded-full text-sm font-semibold " + (tab === t ? "bg-brand-600 text-white" : "bg-white dark:bg-ink-800 border border-slate-200 dark:border-ink-700")}>
            {t[0].toUpperCase() + t.slice(1)}
          </button>
        ))}
      </div>

      {tab === 'dashboard' && (
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
          {stats ? Object.entries({ 'Total users': stats.users, 'Total posts': stats.posts, 'Total comments': stats.comments, 'Total likes': stats.likes, 'Total shares': stats.shares }).map(([label, val]) => (
            <div key={label} className="bg-white dark:bg-ink-800 rounded-xl border border-slate-100 dark:border-ink-700 p-4">
              <p className="text-2xl font-display font-bold">{val}</p>
              <p className="text-xs text-slate-400 mt-1">{label}</p>
            </div>
          )) : <p className="text-sm text-slate-400">Loading…</p>}
        </div>
      )}

      {tab === 'users' && (
        <div>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search users…"
            className="w-full mb-3 px-4 py-2 rounded-xl border border-slate-200 dark:border-ink-700 bg-white dark:bg-ink-800 text-sm" />
          <div className="space-y-2">
            {filtered.map(u => (
              <div key={u.id} className="flex items-center justify-between bg-white dark:bg-ink-800 rounded-xl p-3 border border-slate-100 dark:border-ink-700">
                <div className="flex items-center gap-3">
                  <Avatar user={u} size={9} />
                  <div>
                    <p className="text-sm font-semibold">{u.displayName} {u.suspended && <span className="text-red-500 text-xs ml-1">(suspended)</span>}</p>
                    <p className="text-xs text-slate-400">@{u.username}</p>
                  </div>
                </div>
                <button onClick={() => toggleSuspend(u)} className={"text-xs font-semibold px-3 py-1.5 rounded-full " + (u.suspended ? "bg-emerald-500 text-white" : "bg-red-500 text-white")}>
                  {u.suspended ? 'Reactivate' : 'Suspend'}
                </button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================== RENDER ============================== */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
